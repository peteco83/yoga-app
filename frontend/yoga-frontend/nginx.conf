# Serves the compiled Angular app and proxies /api/ to the Go service.
# Traffic arrives from the Cloudflare Tunnel (frontend:80); this container never
# publishes a port to the internet.

# Behind the tunnel the visitor's address travels in CF-Connecting-IP. Only
# private ranges are trusted, so a LAN client cannot spoof the header.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header CF-Connecting-IP;

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 2m;

    # --- compression -------------------------------------------------------
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # --- security headers --------------------------------------------------
    # add_header is *not* inherited by a location that declares its own, so the
    # same snippet is included again in /api/ below.
    include /etc/nginx/snippets/security-headers.conf;

    # --- container health probe -------------------------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- API ---------------------------------------------------------------
    location /api/ {
        # nginx strips the /api prefix: /api/members -> backend /members
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        # Login tokens and member data must never be cached by a proxy.
        # add_header here shadows the server-level ones, so re-include them.
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # --- static assets -----------------------------------------------------
    # Angular fingerprints these file names, so they can be cached for a year.
    location ~* \.(?:js|css|woff2?)$ {
        expires 1y;
    }

    # Images and fonts under /assets/ are content, not configuration: cache long.
    # A plain (non-^~) prefix match lets this regex win over `location /assets/`.
    location ~* ^/assets/.*\.(?:png|jpe?g|webp|avif|gif|svg|ico|mp4|webm)$ {
        expires 30d;
    }

    # Translation files are not fingerprinted: keep their cache window short so
    # a deploy is visible the same day.
    location /assets/ {
        expires 1h;
    }

    location = /index.html {
        # Never cache the shell: it points at the freshly hashed bundles.
        expires -1;
    }

    # --- client-side routing ----------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}