services:
  postgres:
    image: postgres:15
    container_name: yoga_app_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - yoga-network
    ports:
      - "15432:5432"

  backend:
    build: ./backend
    container_name: yoga-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      CONTACT_NOTIFY_EMAIL: ${CONTACT_NOTIFY_EMAIL}
    networks:
      - yoga-network

  frontend:
    build: ./frontend/yoga-frontend
    container_name: yoga-ui
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5007:80"
    networks:
      - yoga-network

volumes:
  db_data:

networks:
  yoga-network:
